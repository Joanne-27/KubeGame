# Mission 6 — The Redis Red Herring
# FLAW: REDIS_HOST points to "localhost" — unreachable across pod boundaries
apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-deployment
  namespace: cluster-heist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guard
      component: message
  template:
    metadata:
      labels:
        app: guard
        component: message
    spec:
      containers:
        - name: message
          image: "nginx:stable"
          env:
            - name: REDIS_HOST
              value: "localhost"    # ← BROKEN: must be "redis-service"
            - name: REDIS_PORT
              value: "6379"
