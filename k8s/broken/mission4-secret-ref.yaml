# Mission 4 — The Secret Vault Key
# FLAW: Secret does not exist; deployment references a missing secretKeyRef
# The deployment below will enter CreateContainerConfigError until the Secret is created.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeting-deployment
  namespace: cluster-heist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guard
      component: greeting
  template:
    metadata:
      labels:
        app: guard
        component: greeting
    spec:
      containers:
        - name: greeting
          image: "nginx:stable"
          env:
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-key       # ← BROKEN: Secret "vault-key" does not exist yet
                  key: VAULT_TOKEN
