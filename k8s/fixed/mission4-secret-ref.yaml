# Mission 4 — FIXED: Secret created and wired via secretKeyRef
# Step 1: create the Secret
# kubectl create secret generic vault-key \
#   --from-literal=VAULT_TOKEN=golden-yaml-42 -n cluster-heist
apiVersion: v1
kind: Secret
metadata:
  name: vault-key
  namespace: cluster-heist
type: Opaque
stringData:
  VAULT_TOKEN: "golden-yaml-42"   # ✔ FIXED: Secret now exists
---
# Step 2: deployment references it correctly (no change needed if already wired)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeting-deployment
  namespace: cluster-heist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guard
      component: greeting
  template:
    metadata:
      labels:
        app: guard
        component: greeting
    spec:
      containers:
        - name: greeting
          image: "nginx:stable"
          env:
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-key     # ✔ Secret now exists — pod starts cleanly
                  key: VAULT_TOKEN
