# Mission 5 — FIXED: player has read both sidecar container logs
# No manifest change required. Verification is behavioural (logs were streamed).
# Expected output from each container:
#
#   kubectl logs sidecar-informant -c clue-log-1 -n cluster-heist
#   → CLUE_PARAM_A=cluster-key-7749
#
#   kubectl logs sidecar-informant -c clue-log-2 -n cluster-heist
#   → CLUE_PARAM_B=vault-sector-alpha
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-informant
  namespace: cluster-heist
  labels:
    app: guard
    component: informant
spec:
  restartPolicy: Always
  containers:
    - name: clue-log-1
      image: busybox:1.36
      command: ["sh", "-c", "echo 'CLUE_PARAM_A=cluster-key-7749' && sleep 3600"]
    - name: clue-log-2
      image: busybox:1.36
      command: ["sh", "-c", "echo 'CLUE_PARAM_B=vault-sector-alpha' && sleep 3600"]
