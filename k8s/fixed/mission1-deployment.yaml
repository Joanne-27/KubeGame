# Mission 1 — FIXED: correct image repository name
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeting-deployment
  namespace: cluster-heist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guard
      component: greeting
  template:
    metadata:
      labels:
        app: guard
        component: greeting
    spec:
      containers:
        - name: greeting
          image: "nginx:stable"   # ✔ FIXED: "nginxx" → "nginx"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
