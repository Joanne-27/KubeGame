# Final Boss — FIXED: MESSAGE_SERVICE_URL uses Kubernetes service DNS
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeting-deployment
  namespace: cluster-heist
spec:
  replicas: 3
  selector:
    matchLabels:
      app: guard
      component: greeting
  template:
    metadata:
      labels:
        app: guard
        component: greeting
    spec:
      containers:
        - name: greeting
          image: "nginx:stable"
          env:
            - name: MESSAGE_SERVICE_URL
              value: "http://message-service:8080/message"  # ✔ FIXED: "localhost" → "message-service"
