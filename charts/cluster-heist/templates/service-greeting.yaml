apiVersion: v1
kind: Service
metadata:
  name: greeting-service
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  # Mission 2 flaw: selector uses 'gaurd' (typo) — must be corrected to 'guard'
  selector:
    app: gaurd
    component: greeting
  ports:
    - port: {{ .Values.service.greetingPort }}
      targetPort: 80
