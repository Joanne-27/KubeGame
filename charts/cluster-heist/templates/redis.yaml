apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: guard
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guard
      component: redis
  template:
    metadata:
      labels:
        app: guard
        component: redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: guard
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
