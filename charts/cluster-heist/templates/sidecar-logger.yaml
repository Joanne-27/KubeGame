apiVersion: v1
kind: Pod
metadata:
  name: sidecar-informant
  namespace: {{ .Release.Namespace }}
  labels:
    app: guard
    component: informant
spec:
  restartPolicy: Always
  containers:
    - name: clue-log-1
      image: busybox:1.36
      command: ["sh", "-c", "echo 'CLUE_PARAM_A=cluster-key-7749' && sleep 3600"]
    - name: clue-log-2
      image: busybox:1.36
      command: ["sh", "-c", "echo 'CLUE_PARAM_B=vault-sector-alpha' && sleep 3600"]
